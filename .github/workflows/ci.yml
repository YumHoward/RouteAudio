name: build-test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/RouteAudio.sln

      - name: Build
        run: dotnet build src/RouteAudio.sln -c Release --no-restore /warnaserror

      - name: Test
        run: dotnet test tests/RouteAudio.Core.Tests/RouteAudio.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Dependency audit
        run: dotnet list src/RouteAudio.sln package --vulnerable --include-transitive
        continue-on-error: true
