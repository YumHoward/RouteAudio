name: 功能建议
description: 提出新功能或改进建议
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      placeholder: 例如「开会时希望会议声固定进耳机，同时自动压低音乐」
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的实现方式
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 路由 / 设备
        - 规则 / 配置档
        - 界面 / 交互
        - 音量 / 混音
        - 安装 / 更新
        - 其他
    validations:
      required: true
